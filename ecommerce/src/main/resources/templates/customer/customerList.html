<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer List</title>
</head>
<body>
  <div>
    <h1>Page Navigation</h1>
    <a th:href="@{/customer/register}">Register Customer</a>
    <a th:href="@{/customer/search/all}">Customer List</a>
  </div>
  <h1>Customer List Page</h1>

  <div>
    <table border="2">
      <thead>
          <tr>
              <th>#</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
              <th>Phone Number</th>
          </tr>
      </thead>
      <tbody>
          <tr th:each="cust, stat :${customers}">
            <td th:text="${stat.count}"></td>
            <td th:text="${cust.firstName}"></td>
            <td th:text="${cust.lastName}"></td>
            <td th:text="${cust.email}"></td>
            <td th:text="${cust.phoneNumber}"></td>
          </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
